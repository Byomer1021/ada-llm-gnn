# Student LLM (distillation, step 3): LoRA fine-tuning of Qwen 7B on the teacher's answers.
# Used by src/llm/train_student.py; command-line flags override these values.
# The real run needs a CUDA GPU (Colab / lab machine).

base_model: Qwen/Qwen2.5-7B-Instruct
data: data/llm/student_sft.jsonl   # made by: python -m src.llm.generate --export-sft
val_frac: 0.1                      # held-out teacher buildings (split by building, fixed seed)
seed: 0

# Tokens per example (system + user prompt + reasoning trace + JSON). Longer examples are
# DROPPED, never cut: a cut answer would teach the student to stop inside the JSON.
# Teacher v5 answers were 2.5k-8.2k tokens (Nemotron tokenizer) + about 1.4k prompt tokens.
max_length: 10240

# 4-bit QLoRA: the 7B model fits a 16 GB GPU (T4). false = 16-bit weights (24 GB+ GPU).
load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 3
  learning_rate: 2.0e-4
  batch_size: 1
  grad_accum: 8               # effective batch = batch_size * grad_accum
  warmup_ratio: 0.05
  scheduler: cosine
  gradient_checkpointing: true

output_dir: models/student     # <output_dir>/<time>/adapter
served_name: qwen-ada          # model name for vLLM and for generate.py --provider local --model
