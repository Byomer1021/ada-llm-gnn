# Settings of the accessibility check (GNN agents + main agent).

agents:
  models_dir: models        # door.pt, room.pt, route.pt written by src.agents.train
  threshold: 0.5            # probability >= threshold counts as "yes"

main_agent:
  # auto   = try the local Qwen 7B first; if it is not running or gives invalid JSON twice,
  #          use the fallback (GPT-4.1-mini over the API)
  # local  = only the local model      openai = only the fallback model
  # rule   = no LLM: fixed combination rules (baseline for the experiments, works offline)
  provider: auto
  # How the rule main agent decides which rooms can be reached:
  # paths = trace from EXTERIOR over the door and room agents' predictions and the door walls
  #         (the route agent is a second opinion, reported when it disagrees). Default since
  #         22.10.2026: on the 336 test buildings building macro F1 0.892 vs 0.761 with "route".
  # route = the route agent's reachable_prob (the original design; kept for E2 / E3)
  reachability: paths
  local:
    # Ollama (Windows / Mac / Linux):  ollama pull qwen2.5:7b   -> http://localhost:11434/v1
    # vLLM (Linux + GPU):              vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000 -> http://localhost:8000/v1
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b
    api_key_env: null       # local servers need no key
  fallback:
    base_url: null          # null = api.openai.com
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
  # few_shot = send 4 worked examples (prompts/main_agent_examples.json, hand-made buildings) before
  # the building. Off by default: the planned design is zero-shot. For small models that take
  # shortcuts (Qwen 7B pilot, 10 buildings: not_accessible on all, also where a room only could
  # not turn around but blocked nothing)
  few_shot: false
  temperature: 0
  max_tokens: 1500
  timeout_s: 120
